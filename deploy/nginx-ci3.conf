# Tambahkan blok ini ke server block aaPanel untuk domain instalasi.
# Ganti __APP_ROOT__ dengan path absolut aplikasi.
# Nonaktifkan directive bawaan aaPanel `error_page 404 /404.html;` agar respons
# 404 CodeIgniter dan header X-Request-ID tidak diganti oleh halaman statis.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /application/ { return 404; }
location ^~ /system/ { return 404; }
location ^~ /docs/ { return 404; }
location ^~ /database/ { return 404; }
location ^~ /deploy/ { return 404; }
location ^~ /tools/ { return 404; }
location = /app-manifest.json { return 404; }
location = /composer.json { return 404; }
location = /license.txt { return 404; }
location = /setup { return 404; }
location ^~ /setup/ { return 404; }
location ~* \.(sql|sqlite|sqlite3|dump|bak|backup|log|ini)$ { return 404; }

location = /favicon.ico {
    alias __APP_ROOT__/assets/img/namua-projects.svg;
    default_type image/svg+xml;
    expires 7d;
    access_log off;
}

location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md|INSTALL\.md) {
    return 404;
}

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
